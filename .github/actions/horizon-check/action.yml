name: Horizon check
description: >
  Checks the horizon/ directory of a repository (the documentation docs.stratastax.dev includes): the manifest,
  the frontmatter of every page, and that every relative link and image resolves.

inputs:
  root-dir:
    description: The repository root, containing horizon/.
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@v5
      with:
        node-version: 24

    - name: Check horizon/
      shell: bash
      run: |
        cd "${{ github.action_path }}"
        npm install --silent --no-save --no-package-lock yaml@2.9.1
        node check.mjs "${{ github.workspace }}/${{ inputs.root-dir }}"
