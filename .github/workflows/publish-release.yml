name: Publish Release

# Publishes a release when a pull request from develop is merged into main. The release is the latest
# v* tag on the merged develop commit that has no GitHub Release yet, as prepared by
# prepare-release.yml; a merge without such a tag publishes nothing. The version is taken from the
# tag (v1.2.3 publishes 1.2.3), the release notes from its changelog section, and the tag is moved to
# the merge commit on main, so it marks exactly the published code. The input target picks where the
# release goes (secrets: inherit):
# - maven-central (default): publishToMavenCentral of the vanniktech maven-publish plugin, signed, with
#   the secrets MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD, SIGNING_KEY and SIGNING_PASSWORD;
# - repsy: publishAllPublicationsToRepsyRepository, to https://repo.repsy.io/buijs-dev/maven2, with the
#   secrets REPSY_USERNAME and REPSY_PASSWORD. No signing secrets are needed.
on:
  workflow_call:
    inputs:
      root-dir:
        description: Directory containing .sdkmanrc and the Gradle wrapper.
        type: string
        required: false
        default: .
      develop-branch:
        description: Head branch of the release pull request.
        type: string
        required: false
        default: develop
      changelog:
        description: Path of the changelog, relative to the repository root.
        type: string
        required: false
        default: CHANGELOG.md
      target:
        description: Where the release goes, maven-central or repsy.
        type: string
        required: false
        default: maven-central

jobs:
  publish:
    # Callers trigger on pull_request closed (into main); only merged pull requests from develop release.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged && github.event.pull_request.head.ref == inputs.develop-branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: ${{ inputs.root-dir }}
    steps:
      - name: Verify inputs
        working-directory: .
        env:
          TARGET: ${{ inputs.target }}
        run: |
          if [[ "$TARGET" != "maven-central" && "$TARGET" != "repsy" ]]; then
            echo "::error::target must be maven-central or repsy (found '$TARGET')"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "::error::publish-release.yml runs when the release pull request is merged (on: pull_request: types: [closed]), not on $GITHUB_EVENT_NAME. Tag develop and use prepare-release.yml; see https://github.com/buijs-dev/ci-templates#releases"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Determine release
        id: release
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! tag=$(git describe --tags --abbrev=0 --match 'v*' "$HEAD_SHA" 2>/dev/null); then
            echo "::notice::No v* tag on the merged commits; nothing to release"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::notice::$tag is already released; this merge has no new release"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=${tag#v}
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "::error::Release version must not be a SNAPSHOT ($version)"
            exit 1
          fi
          echo "Releasing $tag"
          {
            echo "publish=true"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Read release notes
        id: changelog
        if: steps.release.outputs.publish == 'true'
        uses: buijs-dev/ci-templates/.github/actions/release-changelog@main
        with:
          mode: notes
          version: ${{ steps.release.outputs.version }}
          changelog: ${{ inputs.changelog }}

      - name: Set up Java & Gradle
        if: steps.release.outputs.publish == 'true'
        uses: buijs-dev/ci-templates/.github/actions/setup-java@main
        with:
          root-dir: ${{ inputs.root-dir }}

      - name: Publish to Maven Central
        if: steps.release.outputs.publish == 'true' && inputs.target == 'maven-central'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [[ -z "$ORG_GRADLE_PROJECT_mavenCentralUsername" || -z "$ORG_GRADLE_PROJECT_signingInMemoryKey" ]]; then
            echo "::error::Maven Central needs the secrets MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD, SIGNING_KEY and SIGNING_PASSWORD (secrets: inherit)"
            exit 1
          fi
          ./gradlew publishToMavenCentral -Pversion=${{ steps.release.outputs.version }} --stacktrace

      - name: Publish to Repsy
        if: steps.release.outputs.publish == 'true' && inputs.target == 'repsy'
        env:
          REPSY_USERNAME: ${{ secrets.REPSY_USERNAME }}
          REPSY_PASSWORD: ${{ secrets.REPSY_PASSWORD }}
        run: |
          if [[ -z "$REPSY_USERNAME" || -z "$REPSY_PASSWORD" ]]; then
            echo "::error::Repsy needs the secrets REPSY_USERNAME and REPSY_PASSWORD (secrets: inherit)"
            exit 1
          fi
          ./gradlew publishAllPublicationsToRepsyRepository -Pversion=${{ steps.release.outputs.version }} --stacktrace

      - name: Move tag to the merge commit
        if: steps.release.outputs.publish == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git tag -f "$TAG" "$MERGE_SHA"
          git push -f origin "refs/tags/$TAG"

      - name: Create GitHub Release
        if: steps.release.outputs.publish == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          NOTES_FILE: ${{ steps.changelog.outputs.notes-file }}
        run: gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE" --verify-tag
