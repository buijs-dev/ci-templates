name: Publish Release

# Publishes a release to GitHub Packages with a v* tag on the main branch.
# The version is taken from the tag: v1.2.3 publishes 1.2.3.
# The [Unreleased] section of the changelog becomes the release notes and is moved to
# [1.2.3] - <date> through a pull request to the release and the develop branch.
on:
  workflow_call:
    inputs:
      root-dir:
        description: Directory containing .sdkmanrc and the Gradle wrapper.
        type: string
        required: false
        default: .
      release-branch:
        description: Branch the tagged commit must be on.
        type: string
        required: false
        default: main
      develop-branch:
        description: Branch that also receives the changelog pull request.
        type: string
        required: false
        default: develop
      changelog:
        description: Path of the changelog, relative to the repository root.
        type: string
        required: false
        default: CHANGELOG.md

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: ${{ inputs.root-dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify release tag
        id: tag
        env:
          RELEASE_BRANCH: ${{ inputs.release-branch }}
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != v* ]]; then
            echo "::error::Releases must be triggered by a v* tag (got $GITHUB_REF_TYPE '$GITHUB_REF_NAME')"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$RELEASE_BRANCH"; then
            echo "::error::Tag $GITHUB_REF_NAME is not on $RELEASE_BRANCH"
            exit 1
          fi
          version=${GITHUB_REF_NAME#v}
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "::error::Release version must not be a SNAPSHOT ($version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare changelog
        id: changelog
        uses: buijs-dev/ci-templates/.github/actions/release-changelog@main
        with:
          version: ${{ steps.tag.outputs.version }}
          tag: ${{ github.ref_name }}
          changelog: ${{ inputs.changelog }}

      - name: Set up Java & Gradle
        uses: buijs-dev/ci-templates/.github/actions/setup-java@main
        with:
          root-dir: ${{ inputs.root-dir }}

      - name: Publish to GitHub Packages
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository -Pversion=${{ steps.tag.outputs.version }} --stacktrace

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$NOTES_FILE" --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES_FILE: ${{ steps.changelog.outputs.notes-file }}

      - name: Open changelog pull requests
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG: ${{ inputs.changelog }}
          RELEASE_BRANCH: ${{ inputs.release-branch }}
          DEVELOP_BRANCH: ${{ inputs.develop-branch }}
        run: |
          branch="chore/changelog-$GITHUB_REF_NAME"
          title="chore: changelog for $GITHUB_REF_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898898+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "$CHANGELOG"
          git commit -m "$title"
          git push origin "$branch"
          for base in "$RELEASE_BRANCH" "$DEVELOP_BRANCH"; do
            gh pr create --base "$base" --head "$branch" --title "$title" \
              --body "Moves the [Unreleased] section of \`$CHANGELOG\` to the $GITHUB_REF_NAME release."
          done
