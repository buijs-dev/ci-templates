name: Dokka

# The caller must grant `pages: write` and `id-token: write`.
on:
  workflow_call:
    inputs:
      root-dir:
        description: Directory containing .sdkmanrc and the Gradle wrapper.
        type: string
        required: false
        default: .
      dokka-dir:
        description: Dokka HTML output directory, relative to root-dir.
        type: string
        required: false
        default: build/dokka/html

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: ${{ inputs.root-dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java & Gradle
        uses: buijs-dev/ci-templates/.github/actions/setup-java@main
        with:
          root-dir: ${{ inputs.root-dir }}

      # Use the version of the latest v* tag reachable from this commit (v1.2.3 becomes 1.2.3),
      # or the version in gradle.properties when there is no release yet.
      - name: Determine version
        id: version
        run: |
          if tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null); then
            echo "args=-Pversion=${tag#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Dokka
        run: ./gradlew dokkaGenerate ${{ steps.version.outputs.args }} --stacktrace

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ inputs.root-dir }}/${{ inputs.dokka-dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
