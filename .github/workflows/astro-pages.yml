name: Astro Pages

# Builds an Astro (Starlight) site and deploys it to GitHub Pages.
# The caller must grant `pages: write` and `id-token: write`.
on:
  workflow_call:
    inputs:
      root-dir:
        description: Directory containing package.json of the site.
        type: string
        required: false
        default: .
      node-version-file:
        description: File with the Node version, relative to root-dir.
        type: string
        required: false
        default: .nvmrc
      sources:
        description: >
          Public repositories the build reads from, one per line as owner/repo@ref:path. Each is cloned
          (shallow) into path, relative to root-dir.
        type: string
        required: false
        default: ''
      java-root:
        description: >
          Directory, relative to root-dir, with .sdkmanrc and a Gradle wrapper (usually one of the
          sources). When set, Java and Gradle are installed for the prebuild step.
        type: string
        required: false
        default: ''
      prebuild:
        description: Command run after npm ci and before npm run build, for example npm run sync.
        type: string
        required: false
        default: ''
      dist-dir:
        description: Build output directory, relative to root-dir.
        type: string
        required: false
        default: dist

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: ${{ inputs.root-dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clone sources
        if: inputs.sources != ''
        env:
          SOURCES: ${{ inputs.sources }}
        run: |
          while read -r line; do
            line=$(echo "$line" | xargs)
            [ -z "$line" ] && continue
            repo=${line%%@*}
            rest=${line#*@}
            ref=${rest%%:*}
            path=${rest#*:}
            if [ "$repo" = "$line" ] || [ "$ref" = "$rest" ] || [ -z "$path" ]; then
              echo "::error::Invalid source '$line', expected owner/repo@ref:path"
              exit 1
            fi
            echo "Cloning $repo@$ref into $path"
            git clone --depth 1 --branch "$ref" "https://github.com/${repo}.git" "$path"
            echo "$repo@$ref: $(git -C "$path" rev-parse HEAD)"
          done <<< "$SOURCES"

      - name: Set up Java & Gradle
        if: inputs.java-root != ''
        uses: buijs-dev/ci-templates/.github/actions/setup-java@main
        with:
          root-dir: ${{ inputs.root-dir }}/${{ inputs.java-root }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: ${{ inputs.root-dir }}/${{ inputs.node-version-file }}
          cache: npm
          cache-dependency-path: ${{ inputs.root-dir }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prebuild
        if: inputs.prebuild != ''
        run: ${{ inputs.prebuild }}

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ inputs.root-dir }}/${{ inputs.dist-dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
